[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "industrialdata-alumnado"
version = "0.1.0"
description = "Punto de partida de IndustrialData — UT1, Sistemas de Big Data"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["infra: comprobación de infraestructura", "aceptacion: requisitos de la práctica por implementar"]
